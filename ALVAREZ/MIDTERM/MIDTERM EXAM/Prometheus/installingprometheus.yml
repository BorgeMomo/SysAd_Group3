---
- hosts: all
  become: true
  pre_tasks:
    - name: 1 (CentOS)
      ansible.builtin.dnf:
        update_cache: yes
      changed_when: false
      when: ansible_distribution == "CentOS"

    - name: 1 (Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
      changed_when: false
      when: ansible_distribution == "Ubuntu"

  tasks:
    - name: 2 Creating Prometheus Group
      ansible.builtin.group:
        name: prometheus
        state: present

    - name: 2 Creating Prometheus User 
      ansible.builtin.user: 
        name: prometheus
        group: prometheus
        shell: /usr/sbin/nologin
        system: true
        create_home: false
        state: present

    - name: 3 Create Prometheus Directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus  
        group: prometheus
        mode: '0755'
      loop:
         - etc/prometheus
         - var/lib/prometheus

    - name: 4 Installing Prometheus
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-386.tar.gz"
        dest: /tmp
        remote_src: true

    - name: 5 installing the Prometheus Binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-3.14.0.linux-386/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: prometheus
        group: prometheus
        mode: '0755'
        remote_src: yes
      loop: 
         - prometheus
         - promtool

    - name: 6 Install the Prometheus Configuration File
      ansible.builtin.copy:
        src: "/tmp/prometheus-3.14.0.linux-386/"
        dest: etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        remote_src: yes

    - name: Install Prometheus dependencies on Ubuntu
      ansible.builtin.apt:
        name:
          - tar
          - wget
          - curl
        state: present
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

    - name: Install Prometheus dependencies on CentOS
      ansible.builtin.dnf:
        name:
          - tar
          - wget
          - curl
        state: present
      when: ansible_distribution == "CentOS"
