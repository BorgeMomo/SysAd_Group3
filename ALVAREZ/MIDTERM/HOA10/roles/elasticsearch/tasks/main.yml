---
- name: Install required dependencies
  apt:
    name:
      - apt-transport-https
      - wget
      - gnupg
      - curl
    state: present
    update_cache: true

- name: Download Elastic GPG key
  shell: |
    wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
  args:
    creates: /usr/share/keyrings/elasticsearch-keyring.gpg

- name: Add Elastic 8.x repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://artifacts.elastic.co/packages/8.x/apt stable main"
    filename: elastic-8.x
    state: present

- name: Install Elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: true

- name: Create Elasticsearch configuration directory
  file:
    path: /etc/elasticsearch
    state: directory
    owner: root
    group: elasticsearch
    mode: '0755'

- name: Deploy clean Elasticsearch configuration
  copy:
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0660'
    content: |
      cluster.name: my-application
      node.name: node-1
      path.data: /var/lib/elasticsearch
      path.logs: /var/log/elasticsearch
      network.host: 0.0.0.0
      http.port: 9200
      discovery.type: single-node
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      xpack.security.http.ssl.enabled: false
      xpack.security.transport.ssl.enabled: false

- name: Create Elasticsearch logs directory
  file:
    path: /usr/share/elasticsearch/logs
    state: directory
    owner: elasticsearch
    group: elasticsearch
    mode: '0755'

- name: Reload systemd units
  systemd:
    daemon_reload: true

- name: Enable and start Elasticsearch
  systemd:
    name: elasticsearch
    enabled: true
    state: restarted
