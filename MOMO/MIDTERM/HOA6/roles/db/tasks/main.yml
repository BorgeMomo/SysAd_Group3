---
- name: Install MariaDB on CentOS
  dnf:
    name: mariadb-server
    state: latest
  when: ansible_distribution == "CentOS"

- name: Start and enable MariaDB on CentOS
  service:
    name: mariadb
    state: started
    enabled: true
  when: ansible_distribution == "CentOS"

- name: Install MariaDB on Ubuntu
  apt:
    name: mariadb-server
    state: latest
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Start and enable MariaDB on Ubuntu
  service:
    name: mariadb
    state: started
    enabled: true
  when: ansible_distribution == "Ubuntu"
