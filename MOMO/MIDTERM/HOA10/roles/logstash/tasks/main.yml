---
- name: Install the packages needed for Logstash
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - wget
      - gnupg
    state: present
    update_cache: yes

- name: Add the Logstash signing key
  ansible.builtin.shell: |
    wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/logstash-keyring.gpg
  args:
    creates: /usr/share/keyrings/logstash-keyring.gpg

- name: Add the Logstash package repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/logstash-keyring.gpg] https://artifacts.elastic.co/packages/9.x/apt stable main"
    state: present
    filename: logstash

- name: Install Logstash on the server
  ansible.builtin.apt:
    name: logstash
    state: present
    update_cache: yes

- name: Start Logstash and enable it at boot
  ansible.builtin.service:
    name: logstash
    state: started
    enabled: yes
