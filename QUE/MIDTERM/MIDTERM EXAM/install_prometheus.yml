---
- name: Install and Configure Prometheus on Ubuntu and CentOS
  hosts: prometheus_servers
  become: true
  vars:
    prometheus_version: "3.14.0"

  tasks:
    #
    - name: Task 1 - Prepare the Servers (Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Task 1 - Prepare the Servers (CentOS)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Task 1 - both
      ansible.builtin.package:
        name:
          - wget
          - tar
          - curl
          - net-tools
        state: present

    #
    - name: Task 2 - Create the Prometheus User
      ansible.builtin.user:
        name: prometheus
        system: yes
        shell: /bin/false
        create_home: no

    #
    - name: Task 3 - Create Prometheus Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'
      loop:
        - /etc/prometheus
        - /var/lib/prometheus

    # 
    - name: Task 4 - Download Prometheus
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: yes

    - name: Task 5 - Install the Prometheus Binaries
      ansible.builtin.copy:
        src: "/tmp/prometheus-3.14.0.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: prometheus
        group: prometheus
        mode: '0755'
        remote_src: yes
      loop:
        - prometheus
        - promtool

    # 
    - name: task 6-7
      ansible.builtin.copy:
        src: "/tmp/prometheus-3.14.0.linux-amd64/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
        remote_src: yes

    # 
    - name: Task 8
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus Time Series Collection and Processing Server
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus
          Restart=always

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    # 
    - name: Task 9
      ansible.builtin.systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes

