---
- name: create admin user
  ansible.builtin.user:
    name: admin
    groups: "{{ 'wheel' if ansible_facts['os_family'] == 'RedHat' else 'sudo' }}"
    append: yes
    state: present

- name: add ssh key for admin user
  ansible.builtin.authorized_key:
    user: admin
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExamplePublicKey base-key"
