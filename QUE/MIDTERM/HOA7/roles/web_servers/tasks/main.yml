---
- name: install web server packages
  ansible.builtin.package:
    name:
      - "{{ apache_package }}"
      - "{{ php_package }}"
    state: present

- name: copy default html file for site
  tags: apache, apache2, httpd
  ansible.builtin.copy:
    src: files/default_site.html
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
