---
- name: Install and configure Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - elasticsearch

  tasks:
    - name: Wait for Elasticsearch to become available
      wait_for:
        host: 192.168.56.104
        port: 9200
        delay: 5
        timeout: 60

- name: Install and configure Kibana
  hosts: kibana
  become: true
  roles:
    - kibana

  tasks:
    - name: Wait for Kibana to become available
      wait_for:
        host: 192.168.56.106
        port: 5601
        delay: 5
        timeout: 60

- name: Install and configure Logstash
  hosts: logstash
  become: true
  roles:
    - logstash
