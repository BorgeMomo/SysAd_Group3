---
# Task 1: Prepare the Server

- name: Update package cache on Ubuntu
  ansible.builtin.apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Update packages on Ubuntu
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_os_family == "Debian"

- name: Install required packages on Ubuntu
  ansible.builtin.apt:
    name:
      - wget
      - tar
    state: present
  when: ansible_os_family == "Debian"

- name: Install required packages on CentOS
  ansible.builtin.dnf:
    name:
      - wget
      - tar
    state: present
  when: ansible_os_family == "RedHat"


# Task 2: Create the Prometheus User

- name: Create Prometheus group
  ansible.builtin.group:
    name: prometheus
    state: present

- name: Create Prometheus user
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present


# Task 3: Create Prometheus Directories

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'

- name: Create Prometheus data directory
  ansible.builtin.file:
    path: /var/lib/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'


# Task 4: Download Prometheus

- name: Download Prometheus
  ansible.builtin.get_url:
    url: https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
    dest: /tmp/prometheus.tar.gz
    mode: '0644'


# Task 5: Install the Prometheus Binaries

- name: Extract Prometheus archive
  ansible.builtin.unarchive:
    src: /tmp/prometheus.tar.gz
    dest: /tmp
    remote_src: true
    creates: /tmp/prometheus-3.5.0.linux-amd64

- name: Install Prometheus binary
  ansible.builtin.copy:
    src: /tmp/prometheus-3.5.0.linux-amd64/prometheus
    dest: /usr/local/bin/prometheus
    remote_src: true
    owner: prometheus
    group: prometheus
    mode: '0755'

- name: Install promtool binary
  ansible.builtin.copy:
    src: /tmp/prometheus-3.5.0.linux-amd64/promtool
    dest: /usr/local/bin/promtool
    remote_src: true
    owner: prometheus
    group: prometheus
    mode: '0755'


# Task 6: Install the Prometheus Configuration Files

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'


# Task 7: Validate the Configuration

- name: Validate Prometheus configuration
  ansible.builtin.command:
    cmd: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
  register: prometheus_config_check
  changed_when: false


# Task 8: Create the systemd Service

- name: Install Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true


# Task 9: Start and Enable Prometheus

- name: Start and enable Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started


# Task 10: Verify Prometheus

- name: Task 10 - Check Prometheus service status
  ansible.builtin.systemd:
    name: prometheus
  register: prometheus_service

- name: Task 10 - Display Prometheus service status
  ansible.builtin.debug:
    msg: "Prometheus is {{ prometheus_service.status.ActiveState }}"
