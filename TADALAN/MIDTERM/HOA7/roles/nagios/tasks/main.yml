---
- name: Install Nagios on Ubuntu
  ansible.builtin.apt:
    name:
      - nagios4
      - nagios-nrpe-plugin
    state: present
    update_cache: yes
  become: yes
  when: ansible_facts.os_family == "Debian"

- name: Install DNF plugins on CentOS
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present
  become: yes
  when: ansible_facts.os_family == "RedHat"

- name: Enable CRB repository on CentOS
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  become: yes
  when: ansible_facts.os_family == "RedHat"

- name: Install EPEL repository on CentOS
  ansible.builtin.dnf:
    name: epel-release
    state: present
  become: yes
  when: ansible_facts.os_family == "RedHat"

- name: Install Nagios on CentOS
  ansible.builtin.dnf:
    name:
      - nagios
      - nagios-plugins-all
    state: present
  become: yes
  when: ansible_facts.os_family == "RedHat"

- name: Start and enable Nagios on Ubuntu
  ansible.builtin.service:
    name: nagios4
    state: started
    enabled: yes
  become: yes
  when: ansible_facts.os_family == "Debian"

- name: Start and enable Nagios on CentOS
  ansible.builtin.service:
    name: nagios
    state: started
    enabled: yes
  become: yes
  when: ansible_facts.os_family == "RedHat"
