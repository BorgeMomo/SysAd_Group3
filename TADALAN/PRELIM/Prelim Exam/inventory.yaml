all:
  children:
    ubuntu:
      vars:
        ansible_user: ace
      hosts:
        server1:
          ansible_host: 192.168.56.105
          os_type: Ubuntu
          apache_package: apache2
          php_package: libapache2-mod-php
        server2:
          ansible_host: 192.168.56.106
          os_type: Ubuntu
          apache_package: apache2
          php_package: libapache2-mod-php

    centos:
      vars:
        ansible_user: ace
      hosts:
        centos1:
          ansible_host: 192.168.56.107
          os_type: CentOS
          apache_package: httpd
          php_package: php

    redhat:
      vars:
        ansible_user: ace
      hosts:
        redhat1:
          ansible_host: <RHEL_VM_IP>
          os_type: RedHat
          apache_package: httpd
          php_package: php

    linuxservers:
      children:
        ubuntu:
        centos:
        redhat:
    servers:
      hosts:
        server1:
        centos1:
        redhat1:
